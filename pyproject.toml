[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuestionario-sgc-chiapas-puede"
version = "0.1.0"
description = "Cuestionario del Sistema de Gestion de la Calidad de Chiapas Puede"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-dotenv>=1.0,<2",
    "openpyxl>=3.1,<4",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.package-data]
app = ["static/*"]
